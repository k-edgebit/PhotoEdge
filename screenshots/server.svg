  <rect x="40" y="520" width="280" height="120" rx="14" fill="#1c2a4a" stroke="#2c3e6b"/>
  <text x="60" y="552" fill="#8a93b0" font-size="15">1. 같은 Wi-Fi에 연결하세요</text>
